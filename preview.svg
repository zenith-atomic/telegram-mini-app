<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0b15"/>
      <stop offset="100%" style="stop-color:#111827"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:0"/>
    </radialGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#06b6d4" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>
  <rect x="280" y="140" width="80" height="80" fill="url(#glow)"/>
  
  <!-- Main panel frame -->
  <rect x="20" y="60" width="600" height="240" rx="12" fill="#11131a" stroke="#1e2130" stroke-width="1"/>
  
